<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Finn MoltBot 技巧分析 | Kimi Claw</title>
    <style>
        :root {
            --primary-900: #0f172a;
            --primary-800: #1e293b;
            --primary-700: #334155;
            --primary-600: #475569;
            --primary-500: #64748b;
            --primary-400: #94a3b8;
            --primary-300: #cbd5e1;
            --primary-200: #e2e8f0;
            --primary-100: #f1f5f9;
            --primary-50: #f8fafc;
            --accent-600: #2563eb;
            --accent-500: #3b82f6;
            --accent-400: #60a5fa;
            --accent-100: #dbeafe;
            --accent-50: #eff6ff;
            --success-600: #059669;
            --success-100: #d1fae5;
            --danger-600: #dc2626;
            --danger-100: #fee2e2;
            --warning-600: #d97706;
            --warning-100: #fef3c7;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--primary-100) 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* 導覽列 */
        .site-nav {
            background: var(--primary-900);
            padding: 12px 30px;
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom: 2px solid var(--accent-600);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .site-nav span { color: var(--primary-400); font-size: .9em; margin-right: 5px; }
        .site-nav a {
            padding: 7px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: .9em;
            transition: all 0.2s;
        }
        .nav-nicolas { background: var(--primary-700); color: var(--primary-300); }
        .nav-nicolas:hover { background: #d97706; color: #fff; }
        .nav-alex { background: var(--accent-600); color: #fff; }
        .nav-alex:hover { background: var(--accent-500); }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* Header */
        header {
            text-align: center;
            padding: 48px 32px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #3b82f6 100%);
            border-radius: 24px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-xl);
            color: white;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 12px; }
        header .subtitle { opacity: 0.9; font-size: 1.1rem; }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            text-align: center;
            border-left: 4px solid var(--accent-600);
        }
        .stat-card .number { font-size: 2.5rem; font-weight: bold; color: var(--accent-600); }
        .stat-card .label { color: var(--text-tertiary); font-size: 0.9rem; margin-top: 4px; }

        /* Priority Techniques */
        .priority-section {
            background: linear-gradient(135deg, #fef3c7 0%, #fee2e2 100%);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 32px;
            border: 2px solid var(--warning-600);
        }
        .priority-section h2 {
            color: var(--danger-600);
            font-size: 1.4rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .technique-item {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 4px solid var(--danger-600);
            box-shadow: var(--shadow-sm);
        }
        .technique-item .title { font-weight: bold; color: var(--text-primary); margin-bottom: 4px; }
        .technique-item .desc { color: var(--text-secondary); font-size: 0.95rem; }
        .technique-item .apply { 
            margin-top: 8px; 
            padding: 8px 12px; 
            background: var(--success-100); 
            border-radius: 8px; 
            font-size: 0.9rem;
            color: var(--success-600);
        }

        /* Video Cards */
        .videos-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }
        .video-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-800) 0%, var(--primary-700) 100%);
            color: white;
        }
        .video-header .date { font-size: 0.85rem; opacity: 0.8; margin-bottom: 8px; }
        .video-header h3 { font-size: 1.1rem; line-height: 1.4; }
        .video-body {
            padding: 20px;
        }
        .video-body .summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .key-points {
            margin-bottom: 16px;
        }
        .key-points h4 {
            font-size: 0.9rem;
            color: var(--text-tertiary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .key-points ul {
            list-style: none;
            padding: 0;
        }
        .key-points li {
            padding: 6px 0;
            padding-left: 20px;
            position: relative;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .key-points li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--accent-600);
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: var(--accent-100);
            color: var(--accent-600);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }
        .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
        .empty-state h3 { color: var(--text-secondary); margin-bottom: 8px; }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-tertiary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="site-nav">
        <span>📊 分析儀表板：</span>
        <a href="index.html" class="nav-nicolas">🎬 Nicolas Young</a>
        <a href="alex.html" class="nav-alex">🤖 Alex Finn</a>
    </div>

    <div class="container">
        <header>
            <h1>🤖 Alex Finn MoltBot 技巧分析</h1>
            <p class="subtitle">自動學習系統 | 每晚 03:00 更新 | 高優先技巧自動應用</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="total-videos">0</div>
                <div class="label">分析影片數</div>
            </div>
            <div class="stat-card">
                <div class="number" id="weekly-new">0</div>
                <div class="label">本週新增</div>
            </div>
            <div class="stat-card">
                <div class="number" id="techniques-count">0</div>
                <div class="label">學到技巧</div>
            </div>
            <div class="stat-card">
                <div class="number" id="last-update">-</div>
                <div class="label">最後更新</div>
            </div>
        </div>

        <div class="priority-section">
            <h2>🔥 已自動應用的高優先技巧</h2>
            <div id="priority-techniques">
                <div class="empty-state">
                    <div class="icon">⏳</div>
                    <h3>等待第一次分析...</h3>
                    <p>每天 03:00 自動更新，分析後會顯示高優先技巧</p>
                </div>
            </div>
        </div>

        <div class="videos-section">
            <h2>📹 影片分析記錄</h2>
            <div id="videos-container">
                <div class="empty-state">
                    <div class="icon">🎬</div>
                    <h3>尚無影片記錄</h3>
                    <p>首次分析將於今晚 03:00 自動執行</p>
                </div>
            </div>
        </div>

        <footer>
            <p>自動學習系統 v1.0 | 資料來源：Alex Finn YouTube 頻道</p>
            <p style="margin-top:8px;opacity:0.7">最後更新：<span id="footer-update">尚未更新</span></p>
        </footer>
    </div>

    <script>
        // 載入 alex_data.json
        fetch('alex_data.json')
            .then(r => r.json())
            .then(data => {
                // 更新統計
                document.getElementById('total-videos').textContent = data.videos.length;
                document.getElementById('techniques-count').textContent = data.techniques ? data.techniques.length : 0;
                document.getElementById('last-update').textContent = data.last_updated ? data.last_updated.split(' ')[0] : '-';
                document.getElementById('footer-update').textContent = data.last_updated || '尚未更新';

                // 計算本週新增
                const oneWeekAgo = new Date();
                oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
                const weeklyCount = data.videos.filter(v => new Date(v.date) > oneWeekAgo).length;
                document.getElementById('weekly-new').textContent = weeklyCount;

                // 顯示高優先技巧
                const highPriority = data.techniques ? data.techniques.filter(t => t.priority === '高') : [];
                if (highPriority.length > 0) {
                    const priorityHtml = highPriority.map(t => `
                        <div class="technique-item">
                            <div class="title">${t.title}</div>
                            <div class="desc">${t.description}</div>
                            <div class="apply">✅ 已應用：${t.apply_to_system}</div>
                        </div>
                    `).join('');
                    document.getElementById('priority-techniques').innerHTML = priorityHtml;
                }

                // 顯示影片卡片
                if (data.videos.length > 0) {
                    const videosHtml = data.videos.map(v => `
                        <div class="video-card">
                            <div class="video-header">
                                <div class="date">${v.date}</div>
                                <h3>${v.title}</h3>
                            </div>
                            <div class="video-body">
                                <div class="summary">${v.summary}</div>
                                <div class="key-points">
                                    <h4>關鍵重點</h4>
                                    <ul>
                                        ${v.key_points.map(kp => `<li>${kp}</li>`).join('')}
                                    </ul>
                                </div>
                                <div class="tags">
                                    ${v.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('videos-container').innerHTML = `<div class="video-grid">${videosHtml}</div>`;
                }
            })
            .catch(err => {
                console.error('載入資料失敗:', err);
            });
    </script>
</body>
</html>
